[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html ne doit jamais être mis en cache : sinon les visiteurs
# voient une version périmée avant que le nouveau JS ne se charge.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Les fichiers dans /assets ont un hash dans leur nom (ex: index-XXXX.js) :
# leur contenu ne change jamais sans changer de nom, donc cache long terme sûr.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
